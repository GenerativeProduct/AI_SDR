services:
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: ai-sdr-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=AiSdrLocal123!
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - ai_sdr_opensearch_data:/usr/share/opensearch/data

volumes:
  ai_sdr_opensearch_data:
