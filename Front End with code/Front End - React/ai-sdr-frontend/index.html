<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var theme = 'light';
        try {
          var zustandRaw = localStorage.getItem('sdr-ui');
          if (zustandRaw) {
            var parsed = JSON.parse(zustandRaw);
            if (parsed && parsed.state && (parsed.state.theme === 'dark' || parsed.state.theme === 'light')) {
              theme = parsed.state.theme;
            }
          } else {
            var stored = localStorage.getItem('sdr_theme');
            if (stored === 'dark' || stored === 'light') theme = stored;
          }
        } catch (e) {
          /* ignore */
        }
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>AI SDR — Sales Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
